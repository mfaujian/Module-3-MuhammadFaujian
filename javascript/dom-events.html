<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Manipulation & Event Handling</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    #task-form { display: flex; gap: 8px; margin-bottom: 16px; }
    #task-input { flex: 1; padding: 8px; }
    #task-list { list-style: none; padding: 0; }
    #task-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 6px; }
    #task-list li.done { background-color: #e6ffed; text-decoration: line-through; color: #666; }
    #task-list button { background: #c0392b; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Task List — DOM &amp; Events Exercise</h1>

  <form id="task-form">
    <input type="text" id="task-input" placeholder="Add a task..." required>
    <button type="submit">Add</button>
  </form>

  <p>Total tasks: <span id="counter">0</span></p>
  <ul id="task-list"></ul>

  <script src="dom-events.js"></script>
</body>
</html>
