<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typed Product Catalog — TypeScript + Tailwind</title>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-8 sm:py-12">
    <header class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-8">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">Panel Parts Catalog</h1>
      <div class="flex items-center gap-4">
        <input id="search" type="text" placeholder="Search products..."
          class="w-full sm:w-64 border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
        <span class="text-sm font-medium text-slate-600 whitespace-nowrap">
          Cart: <span id="cart-count" class="text-brand font-bold">0</span>
        </span>
      </div>
    </header>
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>
  <script type="module" src="dist/app.js"></script>
</body>
</html>
