<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typed Product Catalog — TypeScript + Tailwind</title>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8 sm:py-12">
    <header class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-8">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">Panel Parts Catalog</h1>
      <input id="search" type="text" placeholder="Search products..."
        class="w-full sm:w-64 border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
      <div id="product-grid" class="lg:col-span-3 grid grid-cols-1 sm:grid-cols-2 gap-4"></div>

      <aside class="bg-white border border-slate-200 rounded-lg p-4 h-fit">
        <h2 class="font-semibold text-slate-800 mb-2">Cart Summary</h2>
        <hr class="mb-3 border-slate-200">
        <p class="text-sm text-slate-600">Items: <span id="cart-items" class="font-medium">0 items</span></p>
        <p class="text-sm text-slate-600">Total: <span id="cart-total" class="font-bold text-brand">Rp 0</span></p>
      </aside>
    </div>
  </div>

  <script type="module" src="dist/index.js"></script>
</body>
</html>
